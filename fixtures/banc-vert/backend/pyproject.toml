[project]
name = "banc-essai-commandes"
version = "0.0.0"
description = "Banc essai Forge Tests - application de gestion de commandes de repas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "psycopg[binary]>=3.3.4",
    "pytest>=8.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
